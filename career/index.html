<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../Assets/favicon/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="../Assets/favicon/favicon-96x96.png" />
  <link rel="shortcut icon" href="../Assets/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../Assets/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Viral Ads Media" />
  <link rel="manifest" href="../Assets/favicon/site.webmanifest" />
  <title>Loading Careers...</title>
  <base href="../" />
  <style>
    body { margin: 0; background: #050505; color: #fff; font-family: Inter, Arial, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  </style>
</head>
<body>
  <p>Loading...</p>
  <script>
    (async () => {
      try {
        const response = await fetch('../career.html');
        const html = await response.text();
        const withBase = html.replace('<head>', '<head><base href="../">');
        const cleanPath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
        if (cleanPath) {
          window.history.replaceState({}, '', cleanPath);
        }
        document.open();
        document.write(withBase);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<p>Unable to load the career page.</p>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
