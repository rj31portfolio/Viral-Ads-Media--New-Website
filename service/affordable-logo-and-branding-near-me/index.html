<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Logo & Branding Agency in Delhi NCR| Logo Design, Identity & Creative Strategy</title>
  <meta name="description" content="Transform your business identity with Viral Ads Media, a branding agency in Delhi creating strategic logos, visual identities and creative brand experiences that inspire growth." />
  <link rel="icon" type="image/png" href="../../Assets/VAM logo.png" />
  <base href="../../" />
  <style>
    body { margin: 0; background: #050505; color: #fff; font-family: Inter, Arial, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  </style>
</head>
<body>
  <p>Loading...</p>
  <script>
    (async () => {
      try {
        const response = await fetch('../../service.html');
        const html = await response.text();
        const withBase = html.replace('<head>', '<head><base href="../../">');
        const cleanPath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
        if (cleanPath) {
          window.history.replaceState({}, '', cleanPath);
        }
        document.open();
        document.write(withBase);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<p>Unable to load this service page.</p>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
